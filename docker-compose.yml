services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: treningsparker
      POSTGRES_USER: treningsparker
      POSTGRES_PASSWORD: ${DB_PASSWORD:-treningsparker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treningsparker -d treningsparker"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DatabaseProvider: Postgres
      ConnectionStrings__Default: Host=db;Port=5432;Database=treningsparker;Username=treningsparker;Password=${DB_PASSWORD:-treningsparker}
      Jwt__Key: ${JWT_KEY:-CHANGE_ME_development_only_key_at_least_32_chars}
      Admin__Email: ${ADMIN_EMAIL:-admin@treningsparker.no}
      Admin__Password: ${ADMIN_PASSWORD:-Admin123!}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: web
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
