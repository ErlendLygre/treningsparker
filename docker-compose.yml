services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Your_strong_Passw0rd}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ConnectionStrings__Default: Server=db,1433;Database=Treningsparker;User Id=sa;Password=${DB_PASSWORD:-Your_strong_Passw0rd};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY:-CHANGE_ME_development_only_key_at_least_32_chars}
      Admin__Email: ${ADMIN_EMAIL:-admin@treningsparker.no}
      Admin__Password: ${ADMIN_PASSWORD:-Admin123!}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  sqldata:
