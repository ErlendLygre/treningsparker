name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test backend/Treningsparker.sln

  # Builds the frontend inside Docker and publishes the static output to GitHub Pages.
  # Without the API_URL repository variable the site runs in demo mode (data stored in the browser).
  # Set API_URL (Settings -> Secrets and variables -> Actions -> Variables) once the API is hosted.
  pages:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build static site in Docker
        env:
          API_URL: ${{ vars.API_URL }}
          BASE: /${{ github.event.repository.name }}/
        run: |
          if [ -n "$API_URL" ]; then DEMO=false; else DEMO=true; fi
          docker buildx build . -f frontend/Dockerfile --target static \
            --build-arg VITE_DEMO_MODE=$DEMO \
            --build-arg VITE_API_URL="$API_URL" \
            --build-arg VITE_BASE="$BASE" \
            --output type=local,dest=site
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publishes the API and web images to GitHub Container Registry so they can run on any container host.
  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: backend/Dockerfile
            target: ""
          - name: web
            dockerfile: frontend/Dockerfile
            target: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
